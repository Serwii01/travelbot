name: check-flights

# Alternativa sin servidor. Desactivado por defecto porque el bot corre 24/7 en el VPS:
# si ambos leen mensajes de Telegram a la vez, se los reparten y cada uno guarda su estado.
# Para volver a usar GitHub Actions (y apagar el VPS), descomenta el schedule.
on:
  # schedule:
  #   - cron: '0 */3 * * *'
  workflow_dispatch: {}

# Necesario para commitear data/db.json de vuelta al repo.
permissions:
  contents: write

# Evita que dos ejecuciones pisen el estado a la vez.
concurrency:
  group: check-flights
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run flight check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Proveedor por defecto: Travelpayouts (gratis).
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          # Opcionales (descomenta / define como variables del repo si los necesitas):
          # FLIGHT_PROVIDER: travelpayouts   # o mock
          # DEFAULT_CURRENCY: EUR
          # MIN_DROP_PCT: 3
          # TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
        run: npm run check

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/db.json
          if git diff --staged --quiet; then
            echo "Sin cambios en data/db.json"
          else
            git commit -m "chore: update flight data [skip ci]"
            git push
          fi
