name: check-flights

on:
  schedule:
    # Cada 3 horas (UTC).
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

# Necesario para commitear data/db.json de vuelta al repo.
permissions:
  contents: write

# Evita que dos ejecuciones pisen el estado a la vez.
concurrency:
  group: check-flights
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run flight check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AMADEUS_CLIENT_ID: ${{ secrets.AMADEUS_CLIENT_ID }}
          AMADEUS_CLIENT_SECRET: ${{ secrets.AMADEUS_CLIENT_SECRET }}
          # Opcionales (descomenta en variables del repo si los necesitas):
          # AMADEUS_HOSTNAME: api.amadeus.com
          # FLIGHT_PROVIDER: amadeus
          # DEFAULT_CURRENCY: EUR
        run: npm run check

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/db.json
          if git diff --staged --quiet; then
            echo "Sin cambios en data/db.json"
          else
            git commit -m "chore: update flight data [skip ci]"
            git push
          fi
